name: Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Typecheck, test, build, lint, format, audit, and policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Secret scan of tracked source
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Setup Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Repository boundary policy
        run: |
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          test -z "$(git ls-files | awk '/^\.\.\// || /^\// { print }')"
          while read -r link; do
            target="$(realpath -m "$link")"
            case "$target" in
              "$GITHUB_WORKSPACE"/*) ;;
              *) printf 'symlink escapes repository: %s -> %s\n' "$link" "$target" >&2; exit 1 ;;
            esac
          done < <(git ls-files -s | awk '$1 == 120000 { print $4 }')

      - name: Dependency policy and audit
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo install cargo-audit --locked
          cargo audit

      - name: Rust format, lint, typecheck, test, and production build
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo build --locked --release

      - name: Client and fixture tests
        run: |
          python3 tests/preview_client.py
          node --test integrations/bb/client.test.ts
          python3 tests/install.py
          python3 tests/core_fixture.py
          python3 tests/pi_http.py
          python3 tests/workspaces.py
          python3 tests/sync_e2e.py
